services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: pulseops-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/2181' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pulseops-kafka
    restart: unless-stopped
    depends_on:
      # Wait for Zookeeper to be ready, not just started — Kafka boots rockily
      # (and can restart) if it races Zookeeper coming up.
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      # Lightweight TCP check that the broker listener is accepting connections.
      # (A `kafka-broker-api-versions` check spins up a JVM every interval and
      # can time out under Kafka's own startup load, causing false "unhealthy"
      # and aborted dependents.) Generous start_period for the JVM broker boot.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/29092' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s

  postgres:
    image: postgres:16-alpine
    container_name: pulseops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rainz
      POSTGRES_PASSWORD: brainz
      POSTGRES_DB: pulseops
    ports:
      - "5432:5432"
    volumes:
      - pulseops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rainz -d pulseops"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pulseops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pulseops-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://rainz:brainz@postgres:5432/pulseops
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_TARGETS_TOPIC=pulseops.monitors.targets
      - KAFKA_METRICS_TOPIC=pulseops.monitors.metrics
      - KAFKAJS_NO_PARTITIONER_WARNING=1
      - NODE_ENV=production
      - APP_URL=http://localhost:3000

  ping-engine:
    build:
      context: .
      dockerfile: workers/ping-engine/Dockerfile
    container_name: pulseops-ping-engine
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_TARGETS_TOPIC=pulseops.monitors.targets
      - KAFKA_METRICS_TOPIC=pulseops.monitors.metrics
      - KAFKA_CONSUMER_GROUP=pulseops-ping-workers
      - CONCURRENT_WORKERS=50

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: pulseops-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    environment:
      - NODE_ENV=production
      - API_URL=http://api:4000

  docs:
    build:
      context: .
      dockerfile: docs/Dockerfile
    container_name: pulseops-docs
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      # Server-side spec proxy (/openapi.json) reaches the API on the internal
      # network. The "Back to app" link uses NEXT_PUBLIC_APP_URL, baked at build
      # (defaults to http://localhost:3000, correct for host access).
      - API_URL=http://api:4000

volumes:
  pulseops_postgres_data:
